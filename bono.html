<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="shortcut icon" href="https://cdn-icons-png.freepik.com/512/10328/10328754.png" type="image/x-icon">
    <script src="js/bono.js"></script>
    <script src="js/validacionesInputs.js"></script>
    <title>GENERADOR DE PLANTILLAS DE BONO DE GB</title>
</head>

<body>

    <div class="card">
        <div id="cabecera" style="display: flex; justify-content: space-between; align-items: center; text-align: center;">
            <a href="index.html" class="buttons" style="text-decoration: none; background-color: #dc3545;">⬅️
                REGRESAR</a>
            <h2>GENERADOR DE PLANTILLAS: BONO DE GB</h2>
            <button class="buttons" type="button" id="btnNuevaPlantilla"
                style="height: fit-content; background-color: #0d6efd;">➕ NUEVA
                PLANTILLA</button>
        </div>

        <div id="cntndr-fila2" style="display: flex; margin-bottom: 20px; justify-content: space-between; align-items: center;">
            <div id="cntndr-numcliente" class="field2">
                <label id="lbl-numcliente" for="numeroCliente">Número del cliente:</label>
                <input required type="text" inputmode="decimal" id="numeroCliente" form="formCliente" pattern="\d{9}$" maxlength="9" title="El número debe empezar con 9 y tener 9 caracteres">
            </div>

            <div id="cntndr-usuarioE" class="field2">
                <label id="lbl-usuarioe" for="usuarioE">Usuario E:</label>
                <input required type="text" id="usuarioE" form="formCliente" pattern="^E\d{7}$" maxlength="8" title="El nombre de usuario debe empezar con E y tener 8 caracteres">
            </div>

            <div id="cntndr-subcampaña" class="field">
                <label id="lbl-subcampaña" for="subcampaña">Subcampaña:</label>
                <select required id="subcampaña" form="formCliente">
                    <option value="">Seleccionar</option>
                    <option>CONSULTA PREVIA</option>
                    <option>CONTACTADOS</option>
                    <option>CONSULTA PREVIA/DEUDA CEDENTE</option>
                    <option>DEUDA CEDENTE</option>
                </select>
            </div>
        </div>

        <hr style="margin-bottom: 30px;">

        <div id="cntndr-form-result" style="display: flex; justify-content: space-between;">
            <form id="formCliente" name="formCliente">

                <div class="field">
                    <label class="label" for="operador">Operador:</label>
                    <select required id="operador" style="width: 175px;">
                        <option value="">Seleccionar</option>
                        <option>MOVISTAR</option>
                        <option>ENTEL</option>
                        <option>BITEL</option>
                    </select>
                </div>

                <div id="cntndr-bonoofrecido" style="display: flex; flex-wrap: wrap; align-items: center; column-gap: 20px;" class="field">
                    <label class="label" for="promocion">Bono ofrecido:</label>
                    <select style="width: 175px" required name="promocion" id="promocion">
                        <option value="">Seleccionar</option>
                        <option value="5 GB">5 GB</option>
                        <option value="10 GB">10 GB</option>
                        <option value="30 GB">30 GB</option>
                        <option value="30 GB para Tik Tok">30 GB para Tik Tok</option>
                        <option value="doble_bono">30 GB Tiktok por 3 meses + 30 GB por 6 meses</option>
                        <option value="35 GB">35 GB</option>
                        <option value="40 GB">40 GB</option>
                        <option value="55 GB">55 GB</option>
                        <option value="95 GB">95 GB</option>
                        <option value="100 GB">100 GB</option>
                    </select>
                </div>

                <div class="field">
                    <label class="label" for="meses">Cantidad de meses:</label>
                    <select required id="meses" style="width: 175px;">
                        <option value="">Seleccionar</option>
                        <option value="">1 MES</option>
                        <option value="">3 MESES</option>
                        <option value="">6 MESES</option>
                        <option value="">12 MESES</option>
                        <option value="">24 MESES</option>
                        <option value="">36 MESES</option>
                    </select>
                </div>

                <div class="field">
                    <label class="label" for="snLlamada">SN de la llamada:</label>
                    <input style="width: 157px;" required type="text" id="snLlamada" placeholder="Ingresar SN de llamada">
                </div>

                <div class="field">
                    <label class="label" for="vbSupervisor">VB del supervisor:</label>
                    <input style="width: 157px;" required type="text" id="vbSupervisor" placeholder="Ingresar VB de supervisor">
                </div>

                <div class="field">
                    <div class="field">
                        <input type="checkbox" id="nuevoPlanCheck">
                        <label for="nuevoPlanCheck">Nuevo plan: </label>
                    </div>
                    <select style="width: 175px;" disabled id="nuevoPlanCbo">
                        <option>MAX 29.90</option>
                        <option>MAX 39.90</option>
                        <option>MAX 49.90</option>
                        <option>MAX 56.90</option>
                        <option>MAX 60.90</option>
                        <option>MAX ILIMITADO 69.90</option>
                        <option selected>MAX ILIMITADO 79.90</option>
                        <option>MAX ILIMITADO 95.90</option>
                        <option>MAX ILIMITADO 109.90</option>
                        <option>MAX ILIMITADO 159.90</option>
                        <option>MAX ILIMITADO 189.90</option>
                        <option>MAX ILIMITADO 289.90</option>
                    </select>
                </div>

                <div class="field">
                    <label class="label" for="mesAplicar">Meses a aplicar:</label>
                    <input required type="month" id="mesAplicar" style="width: 157px;">
                </div>

                <div class="field" style="justify-content:left;">
                    <input type="checkbox" id="compromisoPago">
                    <label for="compromisoPago" id="lblCompromPago">Compromiso de pago</label>
                </div>

                <div class="field">
                    <div class="field">
                        <input type="checkbox" id="clienteDescuento">
                        <label id="lblClienteDescVig" for="clienteDescuento">Cliente con descuento vigente: Requiere anulación</label>
                    </div>
                </div>

                <div id="cntndr-cods" style="display: flex; flex-direction: column;">
                    <label for="resultado">Ingresar OCCs:</label>
                    <textarea id="textAreaCodigos" style="margin-top: 5px; height: 114px;"></textarea>
                </div>

            </form>

            <div class="linea-vertical"></div>
            <div class="linea-horizontal"></div>

            <div class="result-section">

                <!--INCLUIR CAMPOS DE SEGMENTO Y CICLO DE FACTURACION (opcional)-->
                <div id="cntndr-segmentociclo" class="field">
                    <div class="field" style="margin-bottom: 0;">
                        <input type="checkbox" id="segmentoCheck">
                        <label for="segmentoCbo">Segmento:</label>
                    </div>
                    <select style="width: 53px;" disabled name="segmentoCbo" id="segmentoCbo">
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="P">P</option>
                        <option value="S">S</option>
                    </select>
                    <div id="cntndr-ciclo" class="field" style="margin-bottom: 0;">
                        <div class="field" style="margin-bottom: 0;">
                            <input type="checkbox" id="cicloCheck">
                            <label for="cicloCbo">Ciclo fact.:</label>
                        </div>
                        <select style="width: 53px;" disabled name="cicloCbo" id="cicloCbo">
                            <script>
                                const excluir = [2, 7, 13, 15, 17, 21, 23, 27];
                                for (let i = 1; i <= 28; i++) {
                                    if (!excluir.includes(i)) {
                                        document.write(`<option>${i}</option>`);
                                    }
                                }
                            </script>
                        </select>
                    </div>
                </div>

                <!------------------------------------------------------------->

                <button class="buttons" type="submit" id="mostrarBtn" style="margin-bottom: 10px;" form="formCliente">✅
                    GENERAR PLANTILLA</button>

                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <label for="resultado"><strong>PLANTILLA GENERADA:</strong></label>

                    <button class="buttons" type="button" id="btnCopiar" style="color: black; font-weight: 700;">📋
                        Copiar</button>
                </div>
                <textarea id="resultado" readonly style="height: 340px;"></textarea>
            </div>
        </div>

    </div>

</body>

</html>
