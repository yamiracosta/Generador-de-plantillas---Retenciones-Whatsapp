<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="shortcut icon" href="https://cdn-icons-png.freepik.com/512/10328/10328754.png" type="image/x-icon">
    <script src="js/bono.js"></script>
    <title>GENERADOR DE PLANTILLAS DE BONO DE GB</title>
</head>

<body>    
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <a href="index.html" class="buttons" style="text-decoration: none; background-color: #dc3545;">⬅️ REGRESAR</a>
            <h2>GENERADOR DE PLANTILLAS: BONO DE GB</h2>
            <button class="buttons" type="button" id="btnNuevaPlantilla" style="height: fit-content; background-color: #0d6efd;">➕ NUEVA
                PLANTILLA</button>
        </div>

        <div style="display: flex; margin-bottom: 20px; justify-content: space-between; align-items: center;">
            <div class="field">
                <label for="numeroCliente">Número del cliente:</label>
                <input required type="number" id="numeroCliente" placeholder="Ingrese número del cliente"
                    form="formCliente">
            </div>

            <div class="field">
                <label for="usuarioE">Usuario E:</label>
                <input required type="text" id="usuarioE" placeholder="Ingrese usuario E" form="formCliente">
            </div>

            <div class="field">
                <label for="subcampaña">Subcampaña:</label>
                <select required id="subcampaña" form="formCliente">
                    <option value="">---Seleccionar---</option>
                    <option>CONSULTA PREVIA</option>
                    <option>CONTACTADOS</option>
                    <option>CONSULTA PREVIA/DEUDA CEDENTE</option>
                    <option>DEUDA CEDENTE</option>
                </select>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between;">
            <form id="formCliente" name="formCliente">

                <div class="field">
                    <label for="operador">Operador:</label>
                    <select required id="operador">
                        <option value="">------Seleccionar------</option>
                        <option>Movistar</option>
                        <option>Entel</option>
                        <option>Bitel</option>
                    </select>
                </div>

                <div class="field">
                    <label for="promocion">Bono ofrecido:</label>
                    <input type="text" id="promocion">
                </div>

                <div class="field">
                    <label for="meses">Cantidad de meses:</label>
                    <select required id="meses">
                        <option value="">------Seleccionar------</option>
                        <option value="">1 mes</option>
                        <option value="">3 meses</option>
                        <option value="">6 meses</option>
                        <option value="">12 meses</option>
                        <option value="">24 meses</option>
                        <option value="">36 meses</option>
                    </select>
                </div>

                <div class="field">
                    <label for="snLlamada">SN de la llamada:</label>
                    <input required type="text" id="snLlamada" placeholder="Ingrese SN de la llamada">
                </div>

                <div class="field">
                    <label for="vbSupervisor">VB del supervisor:</label>
                    <input required type="text" id="vbSupervisor" placeholder="---Ingresar VB del supervisor---">
                </div>

                <div class="field">
                    <div class="field">
                        <input type="checkbox" id="nuevoPlanCheck">
                        <label for="nuevoPlanCheck">Nuevo plan: </label>
                        
                    </div>
                    <select disabled id="nuevoPlanCbo">
                        <option>Max 29.90</option>
                        <option>Max 39.90</option>
                        <option>Max 49.90</option>
                        <option>Max 56.90</option>
                        <option>Max 60.90</option>
                        <option>Max Ilimitado 69.90</option>
                        <option selected>Max Ilimitado 79.90</option>
                        <option>Max Ilimitado 95.90</option>
                        <option>Max Ilimitado 109.90</option>
                        <option>Max Ilimitado 159.90</option>
                        <option>Max Ilimitado 189.90</option>
                        <option>Max Ilimitado 289.90</option>
                    </select>
                </div>

                <div class="field">
                    <label for="mesAplicar">Meses a aplicar:</label>
                    <input type="month" id="mesAplicar">
                </div>

                <div class="field" style="justify-content:left;">
                    <input type="checkbox" id="compromisoPago">
                    <label for="compromisoPago" id="lblCompromPago">Compromiso de pago</label>
                </div>

                <div class="field">
                    <div class="field">
                        <input type="checkbox" id="clienteDescuento">
                        <label id="lblClienteDescVig" for="clienteDescuento">Cliente con descuento vigente: Requiere anulación</label>
                    </div>
                </div>

                <div style="display: flex; flex-direction: column;">
                    <label for="resultado">Ingresar códigos (OCCS: obligatorio):</label>
                    <textarea id="textAreaCodigos" style="margin-top: 5px; height: 114px;"></textarea>
                </div>

            </form>

            <div class="result-section">

                <button class="buttons" type="submit" id="mostrarBtn"
                    style="margin-bottom: 10px;" form="formCliente">✅ GENERAR PLANTILLA</button>

                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <label for="resultado"><strong>PLANTILLA GENERADA:</strong></label>

                    <button class="buttons" type="button" id="btnCopiar" style="color: black; font-weight: 700;">📋 Copiar</button>
                </div>
                <textarea id="resultado" readonly style="height: 383px;"></textarea>
            </div>
        </div>

    </div>

</body>

</html>
