<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="shortcut icon" href="https://cdn-icons-png.freepik.com/512/10328/10328754.png" type="image/x-icon">
    <script src="js/notacreditofundada.js"></script>
    <script src="js/validacionesInputs.js"></script>
    <title>GENERADOR DE PLANTILLAS DE NC FUNDADA</title>
</head>

<body>

    <div class="card">
        <div id="cabecera" style="display: flex; justify-content: space-between; align-items: center; text-align: center;">
            <a href="index.html" class="buttons" style="text-decoration: none; background-color: #dc3545;">⬅️
                REGRESAR</a>
            <h2>GENERADOR DE PLANTILLAS: NC FUNDADA</h2>
            <button class="buttons" type="button" id="btnNuevaPlantilla"
                style="height: fit-content; background-color: #0d6efd;">➕ NUEVA
                PLANTILLA</button>
        </div>

        <div id="cntndr-fila2" style="display: flex; margin-bottom: 20px; justify-content: space-between; align-items: center;">
            <div id="cntndr-numcliente" class="field2">
                <label for="numeroCliente">Número del cliente:</label>
                <input required type="number" id="numeroCliente" form="formCliente">
            </div>

            <div id="cntndr-usuarioE" class="field2">
                <label for="usuarioE">Usuario E:</label>
                <input required type="text" id="usuarioE" form="formCliente">
            </div>

            <div id="cntndr-subcampaña" class="field">
                <label for="subcampaña">Subcampaña:</label>
                <select required id="subcampaña" form="formCliente">
                    <option value="">---Seleccionar---</option>
                    <option>CONSULTA PREVIA</option>
                    <option>CONTACTADOS</option>
                    <option>CONSULTA PREVIA/DEUDA CEDENTE</option>
                    <option>DEUDA CEDENTE</option>
                </select>
            </div>
        </div>

        <div id="cntndr-form-result" style="display: flex; justify-content: space-between;">
            <form id="formCliente" name="formCliente">

                <div class="field">
                    <label for="callCenter">Nombre del Call Center:</label>
                    <select required name="callCenter" id="callCenter">
                        <option value="">------Seleccionar------</option>
                        <option selected value="Partner Service">PARTNER SERVICE</option>
                        <option value="GEA">GEA</option>
                    </select>
                </div>

                <div class="field">
                    <label for="campaña">Campaña:</label>
                    <input required type="text" id="campaña">
                </div>

                <div class="field">
                    <label for="imr">IMR del cliente:</label>
                    <input required disabled type="text" id="imr">
                </div>

                <div class="field">
                    <label for="nroRecibo">N° de recibo:</label>
                    <input required type="text" id="nroRecibo">
                </div>

                <div class="field">
                    <div style="width: 59%; margin-bottom: 0;" class="field">
                        <label style="width: 70%;" for="montoConIGV">Monto (con IGV):</label>
                    </div>
                    <input style="width: 50px;" type="text" inputmode="decimal" id="montoConIGV">
                    <button id="btnCalcularMontoSinIGV" type="button" class="buttons"
                        style="width: 5%; height: 30px; display: flex; align-items: center; text-align: center; justify-content: center; background-color: #6c757d;">🧮</button>
                    <input required disabled style="width: 50px;" type="number" name="montoSinIGV" id="montoSinIGV">
                </div>

                <div style="display: flex; flex-direction: column; padding-bottom: 15px;">
                    <label for="motivo">Motivo:</label>
                    <textarea required style="height: 60px;" name="motivo" id="motivo"></textarea>
                </div>

                <div style="display: flex; flex-direction: column; padding-bottom: 15px;">
                    <label for="descarteRealizado">Descarte realizado:</label>
                    <textarea required style="height: 20px;" name="descarteRealizado" id="descarteRealizado"></textarea>
                </div>

                <div class="field">
                    <label for="medidaCorrectiva">Medida Correctiva:</label>
                    <input required disabled type="medidaCorrectiva" id="medidaCorrectiva">
                </div>

                <div class="field">
                    <label for="tipoRegistro">Tipo de registro:</label>
                    <input required disabled type="tipoRegistro" id="tipoRegistro">
                </div>

                <div class="field">
                    <label for="areaImputar">Área a imputar:</label>
                    <select required id="areaImputar">
                        <option value="">------Seleccionar------</option>
                        <option>TELEVENTAS</option>
                        <option>RETENCIONES</option>
                        <option>BACK OFFICE</option>
                        <option>TI</option>
                    </select>
                </div>

                <div class="field">
                    <label for="usuarioResponsable">Usuario responsable del error:</label>
                    <input disabled type="text" id="usuarioResponsable">
                </div>

                <div class="field">
                    <label for="snLlamada">SN de la llamada:</label>
                    <input required type="text" id="snLlamada" placeholder="Ingrese SN de la llamada">
                </div>

                <div id="cntndr-vbsuper" class="field">
                    <label for="vbSupervisor">VB del supervisor:</label>
                    <input required type="text" id="vbSupervisor" placeholder="Ingresar VB del supervisor">
                </div>

            </form>

            <div class="result-section">

                <!--INCLUIR CAMPOS DE SEGMENTO Y CICLO DE FACTURACION (opcional)-->
                <div id="cntndr-segmentociclo" class="field">
                    <div class="field" style="margin-bottom: 0;">
                        <input type="checkbox" id="segmentoCheck">
                        <label for="segmentoCbo">Segmento:</label>
                    </div>
                    <select disabled name="segmentoCbo" id="segmentoCbo">
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="P">P</option>
                        <option value="S">S</option>
                    </select>
                    <div id="cntndr-ciclo" class="field" style="margin-bottom: 0;">
                        <div class="field" style="margin-bottom: 0;">
                            <input type="checkbox" id="cicloCheck">
                            <label for="cicloCbo">Ciclo fact.:</label>
                        </div>
                        <select disabled name="cicloCbo" id="cicloCbo">
                            <script>
                                const excluir = [2, 7, 13, 15, 17, 21, 23, 27];
                                for (let i = 1; i <= 28; i++) {
                                    if (!excluir.includes(i)) {
                                        document.write(`<option>${i}</option>`);
                                    }
                                }
                            </script>
                        </select>
                    </div>
                </div>

                <!------------------------------------------------------------->

                <button class="buttons" type="submit" id="mostrarBtn" style="margin-bottom: 10px;" form="formCliente">✅
                    GENERAR PLANTILLA</button>

                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <label for="resultado"><strong>PLANTILLA GENERADA:</strong></label>

                    <button class="buttons" type="button" id="btnCopiar" style="color: black; font-weight: 700;">📋
                        Copiar</button>
                </div>
                <textarea id="resultado" readonly></textarea>
            </div>
        </div>

    </div>

</body>

</html>
