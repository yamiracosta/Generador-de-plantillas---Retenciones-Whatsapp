<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="shortcut icon" href="https://cdn-icons-png.freepik.com/512/10328/10328754.png" type="image/x-icon">
    <script src="js/notacreditonofundada.js"></script>
    <script src="js/validacionesInputs.js"></script>
    <title>GENERADOR DE PLANTILLAS DE NC NO FUNDADA</title>
</head>

<body>    
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; text-align: center;">
            <a href="index.html" class="buttons" style="text-decoration: none; background-color: #dc3545;">⬅️ REGRESAR</a>
            <h2>GENERADOR DE PLANTILLAS: NC NO FUNDADA</h2>
            <button class="buttons" type="button" id="btnNuevaPlantilla" style="height: fit-content; background-color: #0d6efd;">➕ NUEVA
                PLANTILLA</button>
        </div>

        <div style="display: flex; margin-bottom: 20px; justify-content: space-between; align-items: center;">
            <div class="field2">
                <label for="numeroCliente">Número del cliente:</label>
                <input required type="number" id="numeroCliente"
                    form="formCliente">
            </div>

            <div class="field2">
                <label for="usuarioE">Usuario E:</label>
                <input required type="text" id="usuarioE" form="formCliente">
            </div>

            <div class="field">
                <label for="subcampaña">Subcampaña:</label>
                <select required id="subcampaña" form="formCliente">
                    <option value="">---Seleccionar---</option>
                    <option>CONSULTA PREVIA</option>
                    <option>CONTACTADOS</option>
                    <option>CONSULTA PREVIA/DEUDA CEDENTE</option>
                    <option>DEUDA CEDENTE</option>
                </select>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between;">
            <form id="formCliente" name="formCliente">

                <div class="field">
                    <label for="callCenter">Nombre del Call Center:</label>
                    <select required name="callCenter" id="callCenter">
                        <option value="">------Seleccionar------</option>
                        <option selected value="Partner Service">Partner Service</option>
                        <option value="GEA">GEA</option>
                    </select>
                </div>

                <div class="field">
                    <label for="campaña">Campaña:</label>
                    <input required type="text" id="campaña">
                </div>

                <div class="field">
                    <div class="field" style="margin-bottom: 0; margin-left: 0;">
                        <input style="margin: 0;" type="checkbox" id="imrCheck">
                        <label for="imrCheck">IMR del cliente</label>
                    </div>
                    <input required disabled type="number" step="0.01" id="imrText" placeholder="Ingrese IMR del cliente">
                </div>

                <div class="field">
                    <label for="nroRecibo">N° de recibo:</label>
                    <input required type="text" id="nroRecibo">
                </div>

                <div class="field">
                    <label for="motivo">Motivo:</label>
                    <select required type="motivo" id="motivo">
                        <option value="">---Seleccionar---</option>
                        <option>SERVICIOS VAS</option>
                        <option>RECONEXION</option>
                        <option>COMPRA DE PAQUETES</option>
                    </select>
                </div>

                <div class="field">
                    <div style="width: 59%; margin-bottom: 0;" class="field">
                        <label style="width: 70%;" for="montoConIGV">Monto (con IGV):</label>
                        <input style="width: 30%;" type="number" step="0.01" id="montoConIGV">
                    </div>
                    <button id="btnCalcularMontoSinIGV" type="button" class="buttons"
                        style="width: 5%; height: 30px; display: flex; align-items: center; text-align: center; justify-content: center; background-color: #6c757d;">🧮</button>
                    <input required disabled style="width: 36%;" type="number" name="montoSinIGV" id="montoSinIGV">
                </div>

                <div style="display: flex; flex-direction: column; padding-bottom: 15px;">
                    <label for="detalle">Detalle de la disconformidad:</label>
                    <textarea required style="height: 40px;" name="detalle" id="detalle"></textarea>
                </div>

                <div style="display: flex; flex-direction: column; padding-bottom: 15px;">
                    <label for="descarteRealizado">Descarte realizado:</label>
                    <textarea required style="height: 20px;" name="descarteRealizado" id="descarteRealizado"></textarea>
                </div>

                <div class="field">
                    <label for="medidaCorrectiva">Medida Correctiva:</label>
                    <input required disabled type="medidaCorrectiva" id="medidaCorrectiva">
                </div>

                <div class="field">
                    <label for="tipoRegistro">Tipo de registro:</label>
                    <input required disabled type="tipoRegistro" id="tipoRegistro">
                </div>

                <div class="field">
                    <label for="snLlamada">SN de la llamada:</label>
                    <input required type="text" id="snLlamada" placeholder="Ingrese SN de la llamada">
                </div>

                <div class="field">
                    <label for="vbSupervisor">VB del supervisor:</label>
                    <input required type="text" id="vbSupervisor" placeholder="Ingresar VB del supervisor">
                </div>

            </form>

            <div class="result-section">

                <button class="buttons" type="submit" id="mostrarBtn"
                    style="margin-bottom: 10px;" form="formCliente">✅ GENERAR PLANTILLA</button>

                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <label for="resultado"><strong>PLANTILLA GENERADA:</strong></label>

                    <button class="buttons" type="button" id="btnCopiar" style="color: black; font-weight: 700;">📋 Copiar</button>
                </div>
                <textarea id="resultado" readonly style="height: 422px;"></textarea>
            </div>
        </div>

    </div>

</body>

</html>
