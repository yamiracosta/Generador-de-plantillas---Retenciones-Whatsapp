<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="shortcut icon" href="https://cdn-icons-png.freepik.com/512/10328/10328754.png" type="image/x-icon">
    <script src="js/notacreditonofundada.js"></script>
    <script src="js/validacionesInputs.js"></script>
    <title>GENERADOR DE PLANTILLAS DE NC NO FUNDADA</title>
</head>

<body>    

    <div class="card">
        <div id="cabecera" style="display: flex; justify-content: space-between; align-items: center; text-align: center;">
            <a href="index.html" class="buttons" style="text-decoration: none; background-color: #dc3545;">⬅️ REGRESAR</a>
            <h2>GENERADOR DE PLANTILLAS: NC NO FUNDADA</h2>
            <button class="buttons" type="button" id="btnNuevaPlantilla" style="height: fit-content; background-color: #0d6efd;">➕ NUEVA
                PLANTILLA</button>
        </div>

        <div id="cntndr-fila2" style="display: flex; margin-bottom: 20px; justify-content: space-between; align-items: center;">
            <div id="cntndr-numcliente" class="field2">
                <label id="lbl-numcliente" for="numeroCliente2">Número del cliente:</label>
                <input required type="text" inputmode="decimal" id="numeroCliente2" form="formCliente" pattern="\d{9}$" maxlength="9" title="El número debe empezar con 9 y tener 9 caracteres">
            </div>

            <div id="cntndr-usuarioE" class="field2">
                <label id="lbl-usuarioe" for="usuarioE2">Usuario E:</label>
                <input required type="text" id="usuarioE2" form="formCliente" pattern="^E\d{7}$" maxlength="8" title="El nombre de usuario debe empezar con E y tener 8 caracteres">
            </div>

            <div id="cntndr-subcampaña" class="field">
                <label id="lbl-subcampaña" for="subcampaña2">Subcampaña:</label>
                <select required id="subcampaña2" form="formCliente">
                    <option value="">Seleccionar</option>
                    <option>CONSULTA PREVIA</option>
                    <option>CONTACTADOS</option>
                    <option>CONSULTA PREVIA/DEUDA CEDENTE</option>
                    <option>DEUDA CEDENTE</option>
                </select>
            </div>
        </div>

        <hr style="margin-bottom: 30px;">

        <div id="cntndr-form-result" style="display: flex; justify-content: space-between;">
            <form id="formCliente" name="formCliente">

                <div class="field">
                    <label class="label" for="callCenter">Call Center:</label>
                    <select style="width: 183px;" required name="callCenter" id="callCenter">
                        <option value="">Seleccionar</option>
                        <option value="Partner Service">PARTNER SERVICE</option>
                        <option value="GEA">GEA</option>
                    </select>
                </div>

                <div class="field">
                    <label class="label" for="campaña">Campaña:</label>
                    <input style="width: 165px;" required type="text" id="campaña" placeholder="Ingresar campaña">
                </div>

                <div class="field">
                    <div class="field" style="margin-bottom: 0; margin-left: 0;">
                        <input style="margin: 0;" type="checkbox" id="imrCheck">
                        <label for="imrCheck">IMR del cliente</label>
                    </div>
                    <input style="width: 165px;" required disabled type="text" id="imrText" placeholder="Ingresar IMR del cliente">
                </div>

                <div class="field">
                    <label class="label" for="nroRecibo">N° de recibo:</label>
                    <input style="width: 165px;" required type="text" id="nroRecibo" placeholder="Ingresar N° de recibo">
                </div>

                <div class="field">
                    <label class="label" for="motivo">Motivo:</label>
                    <select style="width: 183px;" required type="motivo" id="motivo">
                        <option value="">Seleccionar</option>
                        <option>SERVICIOS VAS</option>
                        <option>RECONEXION</option>
                        <option>COMPRA DE PAQUETES</option>
                    </select>
                </div>

                <div class="field">
                    <label class="label" for="montoConIGV">Monto (con IGV):</label>
                    <div style="width: 182px; margin-bottom: 0;" class="field">
                        <input style="width: 45px;" type="text" inputmode="decimal" id="montoConIGV">
                        <button id="btnCalcularMontoSinIGV" type="button" class="buttons"
                            style="width: 30px; height: 30px; display: flex; align-items: center; text-align: center; justify-content: center; background-color: #6c757d;">🧮</button>
                        <input required disabled style="width: 45px;" type="number" name="montoSinIGV" id="montoSinIGV">
                    </div>
                </div>

                <div style="display: flex; flex-direction: column; padding-bottom: 15px;">
                    <label for="detalle">Detalle de la disconformidad:</label>
                    <textarea required style="height: 70px;" name="detalle" id="detalle" placeholder="Detallar disconformidad del usuario (Ejemplo: Usuario no reconoce compra de paquetes de GB, e insiste en portarse con otro operador si no se le hace un ajuste en su último recibo)"></textarea>
                </div>

                <div style="display: flex; flex-direction: column; padding-bottom: 15px;">
                    <label for="descarteRealizado">Descarte realizado:</label>
                    <textarea required style="height: 20px;" name="descarteRealizado" id="descarteRealizado" placeholder="Detallar descarte"></textarea>
                </div>

                 <div class="field">
                    <label class="label" for="medidaCorrectiva">Medida Correctiva:</label>
                    <input style="width: 165px;" required disabled type="medidaCorrectiva" id="medidaCorrectiva">
                </div>

                <div class="field">
                    <label class="label" for="tipoRegistro">Tipo de registro:</label>
                    <input style="width: 165px;" required disabled type="tipoRegistro" id="tipoRegistro">
                </div>

                <div class="field">
                    <label class="label" for="snLlamada">SN de la llamada:</label>
                    <input style="width: 165px;" required type="text" id="snLlamada" placeholder="Ingresar SN de llamada">
                </div>

                <div id="cntndr-vbsuper" class="field">
                    <label class="label" for="vbSupervisor">VB del supervisor:</label>
                    <input style="width: 165px;" required type="text" id="vbSupervisor" placeholder="Ingresar VB de supervisor">
                </div>

            </form>

            <div class="linea-vertical"></div>
            <div class="linea-horizontal"></div>

            <div class="result-section">
                <!--INCLUIR CAMPOS DE SEGMENTO Y CICLO DE FACTURACION (opcional)-->
                <div id="cntndr-segmentociclo" class="field">
                    <div class="field" style="margin-bottom: 0;">
                        <input type="checkbox" id="segmentoCheck">
                        <label for="segmentoCbo">Segmento:</label>
                    </div>
                    <select style="width: 53px;" disabled name="segmentoCbo" id="segmentoCbo">
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="P">P</option>
                        <option value="S">S</option>
                    </select>
                    <div id="cntndr-ciclo" class="field" style="margin-bottom: 0;">
                        <div class="field" style="margin-bottom: 0;">
                            <input type="checkbox" id="cicloCheck">
                            <label for="cicloCbo">Ciclo fact.:</label>
                        </div>
                        <select style="width: 53px;" disabled name="cicloCbo" id="cicloCbo">
                            <script>
                                const excluir = [2, 7, 13, 15, 17, 21, 23, 27];
                                for (let i = 1; i <= 28; i++) {
                                    if (!excluir.includes(i)) {
                                        document.write(`<option>${i}</option>`);
                                    }
                                }
                            </script>
                        </select>
                    </div>
                </div>

                <!------------------------------------------------------------->

                <button class="buttons" type="submit" id="mostrarBtn"
                    style="margin-bottom: 10px;" form="formCliente">✅ GENERAR PLANTILLA</button>

                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <label for="resultado"><strong>PLANTILLA GENERADA:</strong></label>

                    <button class="buttons" type="button" id="btnCopiar" style="color: black; font-weight: 700;">📋 Copiar</button>
                </div>
                <textarea id="resultado" readonly></textarea>
            </div>
        </div>

    </div>

</body>

</html>
