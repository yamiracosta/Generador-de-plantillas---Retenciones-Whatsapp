<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de plantillas - Retenciones Whatsapp</title>
    <link rel="shortcut icon" href="https://cdn-icons-png.freepik.com/512/10328/10328754.png" type="image/x-icon">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #f1f8e9);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 30px;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .card {
            width: 200px;
            height: 200px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.15);
            border-color: #007bff;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 15px;
            color: #007bff;
        }

        .card h3 {
            margin: 0;
            font-size: 18px;
            color: #333;
        }

        .footer {
            margin-top: 40px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Selecciona el tipo de plantilla</h2>
        <div class="card-container">
            <div class="card" id="cardDescuento">
                <div class="icon">💸</div>
                <h3>Descuento</h3>
            </div>
            <div class="card" id="cardBono">
                <div class="icon">🎁</div>
                <h3>Bono de GB</h3>
            </div>
            <div class="card" id="cardNcFundada">
                <div class="icon">📋</div>
                <h3>Nota de Crédito Fundada</h3>
            </div>
            <div class="card" id="cardNcNoFundada">
                <div class="icon">📄</div>
                <h3>Nota de Crédito NO Fundada</h3>
            </div>
        </div>
        <div class="footer">
            Haz clic en una opción para continuar
        </div>
    </div>

    <script>
        document.getElementById('cardDescuento').addEventListener('click', () => {
            window.location.href = "descuento.html";
        });

        document.getElementById('cardBono').addEventListener('click', () => {
            window.location.href = "bono.html";
        });

        document.getElementById('cardNcFundada').addEventListener('click', () => {
            window.location.href = "notaCreditoFundada.html";
        });

        document.getElementById('cardNcNoFundada').addEventListener('click', () => {
            window.location.href = "notaCreditoNoFundada.html";
        });
    </script>
</body>

</html>
