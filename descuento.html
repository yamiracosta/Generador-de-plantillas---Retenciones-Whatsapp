<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="shortcut icon" href="https://cdn-icons-png.freepik.com/512/10328/10328754.png" type="image/x-icon">
    <script src="js/descuento.js"></script>
    <script src="js/validacionesInputs.js"></script>
    <title>GENERADOR DE PLANTILLAS DE DESCUENTO</title>
</head>

<body>

    <div class="card">
        <div id="cabecera" style="display: flex; justify-content: space-between; align-items: center; text-align: center;">
            <a href="index.html" class="buttons" style="text-decoration: none; background-color: #dc3545;">⬅️
                REGRESAR</a>
            <h2>GENERADOR DE PLANTILLAS: DESCUENTO</h2>
            <button class="buttons" type="button" id="btnNuevaPlantilla"
                style="height: fit-content; background-color: #0d6efd;">➕ NUEVA
                PLANTILLA</button>
        </div>

        <div id="cntndr-fila2" style="display: flex; margin-bottom: 20px; justify-content: space-between; align-items: center;">
            <div id="cntndr-numcliente" class="field2">
                <label for="numeroCliente">Número del cliente:</label>
                <input required type="number" id="numeroCliente" form="formCliente">
            </div>

            <div id="cntndr-usuarioE" class="field2">
                <label for="usuarioE">Usuario E:</label>
                <input required type="text" id="usuarioE" form="formCliente">
            </div>

            <div id="cntndr-subcampaña" class="field">
                <label for="subcampaña">Subcampaña:</label>
                <select required id="subcampaña" form="formCliente">
                    <option value="">---Seleccionar---</option>
                    <option>CONSULTA PREVIA</option>
                    <option>CONTACTADOS</option>
                    <option>CONSULTA PREVIA/DEUDA CEDENTE</option>
                    <option>DEUDA CEDENTE</option>
                </select>
            </div>
        </div>

        <div id="cntndr-form-result" style="display: flex; justify-content: space-between;">
            <form id="formCliente" name="formCliente">

                <div class="field">
                    <label for="operador">Operador:</label>
                    <select required id="operador">
                        <option value="">------Seleccionar------</option>
                        <option>MOVISTAR</option>
                        <option>ENTEL</option>
                        <option>BITEL</option>
                    </select>
                </div>

                <div class="field">
                    <label for="promocion">Promoción ofrecida:</label>
                    <select required id="promocion">
                        <option value="">------Seleccionar------</option>
                        <option>50% DESCUENTO</option>
                        <option>30% DESCUENTO</option>
                        <option>20% DESCUENTO</option>
                    </select>
                </div>

                <div class="field">
                    <label for="meses">Cantidad de meses:</label>
                    <select required id="meses">
                        <option value="">------Seleccionar------</option>
                        <script>
                            for (let i = 12; i >= 1; i--) {
                                if (i !== 1) {
                                    document.write(`<option>${i} MESES</option>`);
                                } else {
                                    document.write(`<option>${i} MES</option>`);
                                }
                            }
                        </script>
                    </select>
                </div>

                <div class="field">
                    <label for="mesAplicar">Meses a aplicar:</label>
                    <input required type="month" id="mesAplicar">
                </div>

                <div class="field">
                    <label style="width: 66%;" for="comportamientoPago">Comportamiento de pago (1-10):</label>
                    <input style="width: 34%;" required type="number" id="comportamientoPago" min="1" max="10"
                        placeholder="Ingrese comportamiento de pago">
                </div>

                <div class="field">
                    <label for="snLlamada">SN de la llamada:</label>
                    <input required type="text" id="snLlamada" placeholder="Ingrese SN de la llamada">
                </div>

                <div class="field">
                    <label for="vbSupervisor">VB del supervisor:</label>
                    <input required type="text" id="vbSupervisor" placeholder="---Ingresar VB del supervisor---">
                </div>

                <div class="field">
                    <div class="field">
                        <input type="checkbox" id="imrCheck">
                        <label for="imrText">IMR del cliente</label>
                    </div>
                    <input required disabled type="text" id="imrText" placeholder="Ingrese IMR del cliente">
                </div>

                <div class="field">
                    <div class="field">
                        <input type="checkbox" id="nuevoPlanCheck">
                        <label for="nuevoPlanCheck">Nuevo plan: </label>
                    </div>
                    <select disabled id="nuevoPlanCbo">
                        <option>MAX 29.90</option>
                        <option>MAX 39.90</option>
                        <option>MAX 49.90</option>
                        <option>MAX 56.90</option>
                        <option>MAX 60.90</option>
                        <option>MAX ILIMITADO 69.90</option>
                        <option selected>MAX ILIMITADO 79.90</option>
                        <option>MAX ILIMITADO 95.90</option>
                        <option>MAX ILIMITADO 109.90</option>
                        <option>MAX ILIMITADO 159.90</option>
                        <option>MAX ILIMITADO 189.90</option>
                        <option>MAX ILIMITADO 289.90</option>
                    </select>
                </div>

                <div class="field" style="justify-content:left;">
                    <input type="checkbox" id="compromisoPago">
                    <label for="compromisoPago" id="lblCompromPago">Compromiso de pago</label>
                </div>

                <div class="field">
                    <div class="field">
                        <input type="checkbox" id="clienteDescuento">
                        <label id="lblClienteDescVig" for="clienteDescuento">Cliente con descuento vigente:</label>
                    </div>
                    <select required id="requiere">
                        <option value="0">No requiere anulación</option>
                        <option value="1">Requiere anulación</option>
                    </select>
                </div>

                <div style="display: flex; flex-direction: column;">
                    <label for="resultado">Ingresar códigos (OCCS: obligatorio):</label>
                    <textarea id="textAreaCodigos" style="margin-top: 5px; height: 75px;"></textarea>
                </div>

            </form>

            <div class="result-section">
                <!--INCLUIR CAMPOS DE SEGMENTO Y CICLO DE FACTURACION (opcional)-->
                <div id="cntndr-segmentociclo" class="field">
                    <div class="field" style="margin-bottom: 0;">
                        <input type="checkbox" id="segmentoCheck">
                        <label for="segmentoCbo">Segmento:</label>
                    </div>
                    <select disabled name="segmentoCbo" id="segmentoCbo">
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="P">P</option>
                        <option value="S">S</option>
                    </select>
                    <div id="cntndr-ciclo" class="field" style="margin-bottom: 0;">
                        <div class="field" style="margin-bottom: 0;">
                            <input type="checkbox" id="cicloCheck">
                            <label for="cicloText">Ciclo fact.:</label>
                        </div>
                        <select disabled name="cicloCbo" id="cicloCbo">
                            <script>
                                const excluir = [2, 7, 13, 15, 17, 21, 23, 27];
                                for (let i = 1; i <= 28; i++) {
                                    if (!excluir.includes(i)) {
                                        document.write(`<option>${i}</option>`);
                                    }
                                }
                            </script>
                        </select>
                    </div>
                </div>

                <!------------------------------------------------------------->

                <button class="buttons" type="submit" id="mostrarBtn" style="margin-bottom: 10px;" form="formCliente">✅
                    GENERAR PLANTILLA</button>

                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <label for="resultado"><strong>PLANTILLA GENERADA:</strong></label>

                    <button class="buttons" type="button" id="btnCopiar" style="color: black; font-weight: 700;">📋
                        Copiar</button>
                </div>
                <textarea id="resultado" readonly style="height: 379px;"></textarea>
            </div>
        </div>

    </div>

</body>

</html>
